<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="30%" stop-color="#F5B041" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="neon-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Crown Icon -->
  <g transform="translate(160, 20) scale(0.7)" filter="url(#glow)">
    <path d="M-18,6 L-10,-12 L0,-2 L10,-12 L18,6 Z" fill="url(#gold-grad)" />
    <circle cx="-10" cy="-14" r="2" fill="#FFF2D6" />
    <circle cx="0" cy="-4" r="2.2" fill="#FFF2D6" />
    <circle cx="10" cy="-14" r="2" fill="#FFF2D6" />
    <path d="M-16,8 L16,8 L14,11 L-14,11 Z" fill="url(#gold-grad)" />
  </g>

  <!-- "Maxi" Script Wordmark -->
  <text x="160" y="66" text-anchor="middle" font-family="'Playfair Display', 'Brush Script MT', 'Great Vibes', serif" font-size="44" font-weight="700" font-style="italic" fill="url(#gold-grad)" letter-spacing="1">
    Maxi
  </text>

  <!-- Dynamic Red/Gold Underline Streak -->
  <path d="M90,72 Q160,78 230,68" stroke="url(#neon-orange)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- "STUDIO" Tracking -->
  <text x="160" y="88" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#EAEAEA" letter-spacing="7">
    STUDIO
  </text>

  <!-- Subtitle Tag -->
  <text x="160" y="104" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#9CA3AF" letter-spacing="2.5">
    PRIVATE BARBER STUDIO
  </text>
</svg>
